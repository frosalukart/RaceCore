name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest # Notice dari GitHub hanya peringatan bahwa OS ini akan di-update tahun 2026, abaikan saja.
    
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      
    - name: Set up Java
      uses: actions/setup-java@v5 # ⚠️ UBAH DARI v4 MENJADI v5 DI SINI
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: mvn clean package
