name: RaceCore
version: '2.0.0'
main: com.racecore.RaceCore
api-version: '1.21'
description: Data-driven race system. Every race is a YAML file.
softdepend: [Vault, PlaceholderAPI, floodgate]
commands:
  race:
    description: View races and your current race.
    permission: racecore.race
  reroll:
    description: Use a reroll, buy one, or check your balance.
    usage: /reroll [buy|balance]
    permission: racecore.reroll
  removerace:
    description: Reset your race to Human.
    permission: racecore.removerace
  racemanage:
    description: Admin tool for races and rerolls.
    usage: /racemanage <player> [set <race>|givereroll <n>|takereroll <n>|setreroll <n>]
    permission: racecore.admin
  racesystem:
    description: Reload, migrate or get help.
    usage: /racesystem <reload|migrate|help>
    permission: racecore.admin
permissions:
  racecore.admin: {default: op}
  racecore.race: {default: true}
  racecore.reroll: {default: true}
  racecore.removerace: {default: true}
