economy:
  reroll-cost: 5000000

# Chance weight per rarity when rolling. Races with "rollable: false" are never rolled.
roll-weights:
  COMMON: 50
  UNCOMMON: 25
  RARE: 15
  EPIC: 8
  LEGENDARY: 2

