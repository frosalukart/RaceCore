# =====================================================================
#  RaceCore races. One section per race. Add new races here or in any
#  other .yml file inside this folder, then run /racesystem reload.
#
#  Effect levels: 0 = level I, 1 = level II, 2 = level III ...
#  Effect groups: effects (always), day-effects, night-effects,
#    nether-effects, water-effects (underwater), underground-effects
#    (y<60, no sky), cold-effects (snowy/cold biomes)
#  rarity: COMMON UNCOMMON RARE EPIC LEGENDARY (weights in config.yml)
#  rollable: false = never rolled, admin/crate only:
#    /racemanage <player> set <race>
# =====================================================================

